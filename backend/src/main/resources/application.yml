spring:
  profiles:
    active: dev   # Perfil por defecto

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  secret: your_secret_key_here_must_be_at_least_32_bytes_long
  expiration: 36000000   # 10 horas en milisegundos

# =========================
# Perfil de DESARROLLO (H2)
# =========================
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:cedeuniondb
    driver-class-name: org.h2.Driver
    username: admi@user
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update   # usa 'create' la primera vez si quieres generar tablas

# =========================
# Perfil de PRODUCCIÓN (MySQL)
# =========================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/cedeunion?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate   # en prod no generes tablas automáticamente
    show-sql: false

